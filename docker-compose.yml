services:
  # Almacenamiento de Objetos (MinIO)
  minio:
    image: minio/minio
    container_name: lis_core_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"        # API de MinIO (accesible desde el host)
      - "9001:9001"        # Consola web de MinIO
    networks:
      - liscore_network

  # Motor de PDF (Gotenberg)
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg_pdf_api
    restart: always
    environment:
      - CHROMIUM_DISABLE_WEB_SECURITY=true
    ports:
      - "3000:3000"        # API de Gotenberg (accesible desde el host)
    networks:
      - liscore_network

  # API Backend (FastAPI)
  api:
    image: lis_core_api:prod
    pull_policy: never
    container_name: lis_core_api
    restart: always
    depends_on:
      - minio
      - gotenberg
    env_file:
      - .env
    environment:
      GOTENBERG_URL: http://gotenberg:3000
      MINIO_ENDPOINT: 192.168.200.8:9000
    ports:
      - "8000:8000"
    networks:
      - liscore_network

networks:
  liscore_network:
    external: true

volumes:
  minio_data: