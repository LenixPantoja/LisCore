version: '3'

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Consola Web
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=L1nuxD3v
      # Eliminamos las variables de URL de dominio para evitar conflictos en local
    restart: unless-stopped
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"
    networks:
      - corelab_network

networks:
  corelab_network:
    external: true